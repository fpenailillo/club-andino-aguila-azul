# ============================================================================
# cloudbuild.yaml — CI/CD para Google Cloud Build
# Club Andino Águila Azul · Sistema Contable
#
# Trigger: push a rama 'main' del repositorio
# Base de datos: Neon PostgreSQL (sin Cloud SQL Auth Proxy)
# Región: southamerica-east1 (São Paulo)
# ============================================================================

substitutions:
  _REGION: southamerica-east1
  _SERVICE_NAME: sistema-contable
  _REPO: southamerica-east1-docker.pkg.dev/$PROJECT_ID/sistema-contable/app

steps:
  # ─── 1. Build de la imagen Docker ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build
    args:
      - build
      - --tag
      - $_REPO:$COMMIT_SHA
      - --tag
      - $_REPO:latest
      - --cache-from
      - $_REPO:latest
      - --file
      - Dockerfile
      - .

  # ─── 2. Push a Artifact Registry ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push
    waitFor: [build]
    args:
      - push
      - --all-tags
      - $_REPO

  # ─── 3. Desplegar en Cloud Run ─────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_REPO:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      # ── Secrets desde Secret Manager ──
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest
      - --set-secrets=AUTH_SECRET=AUTH_SECRET:latest
      - --set-secrets=AUTH_GOOGLE_ID=AUTH_GOOGLE_ID:latest
      - --set-secrets=AUTH_GOOGLE_SECRET=AUTH_GOOGLE_SECRET:latest
      - --set-secrets=RESEND_API_KEY=RESEND_API_KEY:latest
      # ── Variables de entorno directas ──
      - --set-env-vars=AUTH_URL=https://sistema.clubandinoaguilaazul.cl
      - --set-env-vars=NODE_ENV=production
      # ── Recursos mínimos (costo ~$0 con free tier de Cloud Run) ──
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --concurrency=50

images:
  - $_REPO:$COMMIT_SHA
  - $_REPO:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
