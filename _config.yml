title: "Club Andino Águila Azul"
description: "86 años promoviendo los deportes de montaña en Chile"
url: "https://fpenailillo.github.io"
baseurl: "/club-andino-aguila-azul"

author: "Club Andino Águila Azul"
lang: "es"
locale: "es_CL"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-sitemap

include:
  - "*.html"
  - "*.css"
  - "*.js"
  - "*.json"
  - "*.md"
  - "icons/**"
  - "images/**"

exclude:
  - README.md
  - EVALUACION_DAV.md
  - MEJORAS_README.md
  - RESERVAS_README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
